<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablice - TaskBoard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="bg-dark text-white py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0 fw-bold">TaskBoard</h1>
            <div class="d-flex align-items-center gap-3">
                <span id="userName"></span>
                <button id="logoutBtn" class="btn btn-outline-light">
                    Wyloguj
                </button>
            </div>
        </div>
    </header>

    <main class="container mt-4">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
            <h2 class="mb-0">Moje tablice</h2>

            <button id="addBoardBtn" class="btn btn-primary fw-semibold px-4 py-2"
                    data-bs-toggle="modal" data-bs-target="#boardModal">
                + Dodaj tablicę
            </button>
        </div>

        <div id="boardsList" class="row g-3"></div>

        <div class="modal fade" id="boardModal" tabindex="-1" role="dialog" aria-labelledby="boardModalTitle" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form id="boardForm" novalidate>
                        <div class="modal-header">
                            <h2 class="modal-title fs-5" id="boardModalTitle">Dodaj tablicę</h2>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Zamknij"></button>
        </div>

            <div class="modal-body">
                <label for="boardName" class="form-label">Nazwa tablicy</label>
                <input type="text" id="boardName" class="form-control" required>
                <div class="invalid-feedback">Podaj nazwę tablicy.</div>

                <label for="boardDescription" class="form-label mt-3">Opis</label>
                <textarea id="boardDescription" class="form-control"></textarea>

                <p id="boardError" class="text-danger mt-2" role="alert"></p>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Anuluj</button>
                <button type="submit" class="btn btn-primary">Zapisz</button>
            </div>
        </form>
        </div>
    </div>
    </div>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/boards.js"></script>
</body>
</html>
