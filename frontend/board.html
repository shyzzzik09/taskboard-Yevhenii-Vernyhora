<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadania - TaskBoard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="container mt-4">
        <h1>TaskBoard</h1>
        <a href="boards.html" class="btn btn-secondary">Wróć do tablic</a>
        <button id="logoutBtn" class="btn btn-danger">Wyloguj</button>
    </header>

    <main class="container mt-4">
        <h2>Zadania tablicy</h2>
            <button id="addTaskBtn" class="btn btn-primary mt-3"
            data-bs-toggle="modal" data-bs-target="#taskModal">
            Dodaj zadanie
            </button>

            <div class="mt-3 mb-3">
                <label for="filterPriority" class="form-label">Filtr priorytetu</label>
                <select id="filterPriority" class="form-select">
                    <option value="">Wszystkie</option>
                    <option value="low">Niski</option>
                    <option value="medium">Średni</option>
                    <option value="high">Wysoki</option>
                </select>
            </div>
        
    <div class="row mt-4">
            <div class="col-md-4">
            <h3>Do zrobienia</h3>
            <div id="todoList"></div>
        </div>

        <div class="col-md-4">
            <h3>W trakcie</h3>
            <div id="progressList"></div>
        </div>

        <div class="col-md-4">
            <h3>Gotowe</h3>
            <div id="doneList"></div>
        </div>
    </div>

    </main>

    <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Dodaj zadanie</h4>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="taskForm">
                    <label for="taskTitle" class="form-label">Tytuł</label>
                    <input type="text" id="taskTitle"
                           class="form-control" required>
                           <div class="invalid-feedback">
                                    Tytuł musi mieć od 3 do 100 znaków.
                            </div>

                    <label for="taskDescription" class="form-label mt-3">
                        Opis
                    </label>
                    <textarea id="taskDescription"
                              class="form-control"></textarea>

                    <button type="submit" class="btn btn-primary mt-3">
                        Zapisz
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="board.js"></script>
</body>
</html>
