
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie - TaskBoard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <main class="container min-vh-100 d-flex justify-content-center align-items-center py-4">

        <div class="card shadow-sm p-4 w-100" style="max-width: 450px;">

            <h1 class="text-center mb-4">TaskBoard</h1>

            <ul class="nav nav-tabs nav-fill mb-4" id="authTabs">
                <li class="nav-item">
                    <button class="nav-link active" type="button"
                            data-bs-toggle="tab" data-bs-target="#loginTab">
                        Logowanie
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" type="button"
                            data-bs-toggle="tab" data-bs-target="#registerTab">
                        Rejestracja
                    </button>
                </li>
            </ul>

            <div class="tab-content">

                <div class="tab-pane fade show active" id="loginTab">
                    <form id="loginForm">
                        <label for="login" class="form-label">Login</label>
                        <input type="text" id="login"
                               class="form-control mb-3" required>

                        <label for="password" class="form-label">Hasło</label>
                        <input type="password" id="password"
                               class="form-control mb-3" required>

                        <button type="submit" class="btn btn-primary w-100">
                            Zaloguj się
                        </button>
                    </form>

                    <p id="message" class="text-danger mt-3 mb-0"
                       role="status" aria-live="polite"></p>
                </div>

                <div class="tab-pane fade" id="registerTab">
                    <form id="registerForm" novalidate>
                        <label for="registerLogin" class="form-label">Login</label>
                        <input type="text" id="registerLogin"
                               class="form-control mb-3" required>

                        <label for="registerPassword" class="form-label">Hasło</label>
                        <input type="password" id="registerPassword"
                               class="form-control" minlength="8" required>
                        <div class="invalid-feedback">
                            Hasło musi mieć co najmniej 8 znaków.
                        </div>
                        <label for="confirmPassword" class="form-label mt-3">
                            Powtórz hasło
                        </label>
                        <input type="password" id="confirmPassword"
                            class="form-control" required>
                        <div class="invalid-feedback">
                            Hasła muszą być takie same.
                        </div>

                        <label for="firstName" class="form-label mt-3">Imię</label>
                        <input type="text" id="firstName"
                               class="form-control mb-3" required>

                        <label for="lastName" class="form-label">Nazwisko</label>
                        <input type="text" id="lastName"
                               class="form-control mb-3" required>

                        <button type="submit" class="btn btn-primary w-100">
                            Zarejestruj się
                        </button>
                    </form>

                    <p id="registerMessage" class="text-danger mt-3 mb-0"
                       role="status" aria-live="polite"></p>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
