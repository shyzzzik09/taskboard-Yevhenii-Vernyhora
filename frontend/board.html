<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadania - TaskBoard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar navbar-dark bg-dark px-3">
        <h1>TaskBoard</h1>

        <div class="d-flex gap-2">
            
            <span id="userName" class="text-white me-3"></span>
            <a href="boards.html" class="btn btn-outline-light btn-sm">
                Wróć do tablic
            </a>
            <button id="logoutBtn" class="btn btn-outline-light btn-sm">
                Wyloguj
            </button>
        </div>
    </header>

    <main class="container mt-4">
        <h2>Zadania tablicy</h2>
            <button id="addTaskBtn" class="btn btn-primary mt-3"
            data-bs-toggle="modal" data-bs-target="#taskModal">
            Dodaj zadanie
            </button>

            <div class="row mt-3 mb-3 g-3">
                <div class="col-md-4">
                    <label for="filterPriority" class="form-label">Priorytet</label>
                    <select id="filterPriority" class="form-select">
                    <option value="">Wszystkie</option>
                    <option value="low">Niski</option>
                    <option value="medium">Średni</option>
                    <option value="high">Wysoki</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="filterAssignee" class="form-label">Osoba</label>
                <select id="filterAssignee" class="form-select">
                    <option value="">Wszystkie osoby</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="filterQ" class="form-label">Szukaj po tytule</label>
                <input id="filterQ" type="text" class="form-control"
                    placeholder="Wpisz tytuł zadania">
            </div>

            <div class="col-12">
                <button id="clearFilters" class="btn btn-secondary" type="button">
                    Wyczyść filtry
                </button>
            </div>
        </div>
<div class="row mt-4">
    <div class="col-md-4">
        <div class="task-column todo-column">
            <h3>Do zrobienia</h3>
            <div id="todoList"></div>
        </div>
    </div>

        <div class="col-md-4">
            <div class="task-column progress-column">
                <h3>W trakcie</h3>
                <div id="progressList"></div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="task-column done-column">
                <h3>Gotowe</h3>
                <div id="doneList"></div>
            </div>
        </div>
    </div>
</div>

    </main>

    <div class="modal fade" id="taskModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h4 class="modal-title">Dodaj zadanie</h4>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="taskForm">
                    <label for="taskTitle" class="form-label">Tytuł</label>
                    <input type="text" id="taskTitle"
                           class="form-control" required>
                           <div class="invalid-feedback">
                                    Tytuł musi mieć od 3 do 100 znaków.
                            </div>

                    <label for="taskDescription" class="form-label mt-3">
                        Opis
                    </label>
                    <textarea id="taskDescription"
                              class="form-control" rows="3"></textarea>
                              <div class="row mt-3">
                                    <div class="col-md-6">
                                        <label for="taskStatus" class="form-label">Status</label>
                                        <select id="taskStatus" class="form-select">
                                            <option value="todo">Do zrobienia</option>
                                            <option value="in_progress">W trakcie</option>
                                            <option value="done">Gotowe</option>
                                        </select>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="taskPriority" class="form-label">Priorytet</label>
                                        <select id="taskPriority" class="form-select">
                                            <option value="low">Niski</option>
                                            <option value="medium">Średni</option>
                                            <option value="high">Wysoki</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row mt-3">
                                    <div class="col-md-6">
                                        <label for="taskDeadline" class="form-label">Termin (opcjonalnie)</label>
                                        <input type="date" id="taskDeadline" class="form-control">
                                    </div>

                                    <div class="col-md-6">
                                        <label for="taskAssignee" class="form-label">Osoba (opcjonalnie)</label>
                                        <select id="taskAssignee" class="form-select">
                                            <option value="">Nieprzypisane</option>
                                        </select>
                                    </div>
                                </div>

                                <p id="taskCreatedAt" class="small text-secondary mt-3"></p>

                                <div class="modal-footer px-0">
                                    <button type="button" class="btn btn-outline-secondary"
                                        data-bs-dismiss="modal">
                                        Anuluj
                                    </button>

                                    <button type="submit" class="btn btn-primary">
                                        Zapisz zadanie
                                    </button>
                            </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/board.js"></script>
</body>
</html>
